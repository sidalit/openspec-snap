name: openspec
base: core26
version: '1.15.0'
title: OpenSpec
icon: snap/gui/openspec.png
summary: Spec-driven development for AI coding assistants
description: |
  OpenSpec adds a lightweight spec layer to your project, so you and your AI
  coding assistant agree on what to build before any code is written. It
  sets up skills and commands for Claude Code, Cursor, Codex, GitHub Copilot
  and 20+ other assistants, and manages proposals, specs and their archive.

  **Examples**

     cd ~/my-project
     openspec init
     openspec list
     openspec validate --all
     openspec archive add-dark-mode
license: MIT
grade: stable
confinement: strict
website: https://openspec.dev
source-code:
  - https://github.com/Fission-AI/OpenSpec
  - https://github.com/sidalit/openspec-snap
issues:
  - https://github.com/Fission-AI/OpenSpec/issues
  - https://github.com/sidalit/openspec-snap/issues
contact: https://github.com/sidalit/openspec-snap/issues

platforms:
  amd64:
  arm64:

apps:
  openspec:
    command: bin/openspec
    completer: share/bash-completion/completions/openspec
    plugs:
      - home
      - removable-media
      - network
    environment:
      # Updates come from the Snap Store.
      OPENSPEC_NO_UPDATE_CHECK: '1'

parts:
  bun:
    plugin: nil
    build-snaps:
      - node/24/stable
    build-packages:
      - curl
    override-build: |
      # Match the Bun compiler used by upstream's binary build workflow.
      bun_version=1.4.3
      npm install --global --prefix "$CRAFT_PART_INSTALL" "bun@$bun_version"
      mkdir -p "$CRAFT_PART_INSTALL/share/doc/bun"
      curl --fail --location --retry 3 \
        "https://raw.githubusercontent.com/oven-sh/bun/bun-v$bun_version/LICENSE.md" \
        -o "$CRAFT_PART_INSTALL/share/doc/bun/LICENSE.md"
    prime:
      - share/doc/bun/LICENSE.md

  pnpm:
    plugin: nil
    build-snaps:
      - node/24/stable
    override-build: |
      # Corepack selects the pnpm version from upstream's packageManager field.
      npm install --global --prefix "$CRAFT_PART_INSTALL" corepack@0.36.0
    prime:
      - -*

  openspec:
    after: [bun, pnpm]
    plugin: nil
    source: https://github.com/Fission-AI/OpenSpec.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-snaps:
      - node/24/stable
    build-environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - OPENSPEC_TELEMETRY: '0'
      - OPENSPEC_NO_UPDATE_CHECK: '1'
    stage-packages:
      - git
    override-build: |
      export PATH="$CRAFT_STAGE/bin:$PATH"
      # Installing runs the upstream build through its prepare script.
      pnpm install --frozen-lockfile
      bun scripts/binary/build.mjs
      install -Dm755 "dist-bin/openspec-linux-$(node -p process.arch)" \
        "$CRAFT_PART_INSTALL/bin/openspec"

      mkdir -p "$CRAFT_PART_INSTALL/share/bash-completion/completions"
      completion="$CRAFT_PART_INSTALL/share/bash-completion/completions/openspec"
      node bin/openspec.js completion generate bash > "$completion"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/openspec/LICENSE"
      # Bundled dependencies still need their license and notice files.
      notices="$CRAFT_PART_INSTALL/share/doc/openspec/dependencies"
      mkdir -p "$notices"
      find node_modules/.pnpm -type f \( -iname 'license*' -o -iname 'licence*' \
        -o -iname 'copying*' -o -iname 'notice*' \) -exec cp --parents -t "$notices" {} +
